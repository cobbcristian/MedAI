# Publishes the CRA production build to branch `gh-pages` (GitHub Pages project site).
# Kept separate from other CI workflows to avoid merge conflicts.
name: Publish GitHub Pages

on:
  push:
    branches: [main, pitch-deck-only]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          CI: false
          PUBLIC_URL: /MedAI
        run: |
          cd frontend
          npm ci
          npm run build

      - name: SPA fallback for GitHub Pages
        run: cp frontend/build/index.html frontend/build/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
          publish_branch: gh-pages
